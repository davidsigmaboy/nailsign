name: Build nailsign IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Подправь под структуру проекта после того, как закинешь туда форк SideStore
  WORKSPACE: AltStore.xcworkspace
  SCHEME: AltStore
  APP_NAME: nailsign
  XCODE: /Applications/Xcode_15.4.app

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE"

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "build/$APP_NAME.xcarchive" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 40

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/$APP_NAME.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr "$APP_NAME.ipa" Payload -x "*.DS_Store"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: build/${{ env.APP_NAME }}.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}.ipa
