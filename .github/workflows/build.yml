name: Build nailsign IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build nailsign.ipa
    runs-on: xcode-27   # hosted macOS-образ с Xcode 27 (как у апстрима SideStore)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # SideStore + minimuxer + SideSign
          fetch-depth: 1

      - name: Install tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"

      - name: Rebrand
        run: bash scripts/rebrand.sh upstream/SideStore

      - name: Build
        working-directory: upstream/SideStore
        run: |
          set -o pipefail
          mkdir -p build/logs
          make -B build 2>&1 | tee build/logs/build.log | xcbeautify
          make fakesign
          make ipa

      - name: Rename IPA
        run: mv upstream/SideStore/SideStore.ipa nailsign.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: nailsign-ipa
          path: nailsign.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: upstream/SideStore/build/logs/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nailsign.ipa
